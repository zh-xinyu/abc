[project]
name = "abc-minimal"
version = "0.1.0"
description = "Minimal end-to-end release for the abc dataset and the ABC-DiT (LBM) policy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "torch==2.11.0+cu128",
    "torchcodec==0.11.0+cpu",
    "mujoco",
    "mujoco-warp",
    "warp-lang",
    "mjviser",
    "viser",
    "imageio[ffmpeg]",
    "ftfy",
    "regex",
    # tyro powers the dataclass CLI configs.
    "tyro",
    # mcap-protobuf-support already pulls in mcap, but list it explicitly
    # so users who only run export_mcap.py see the dep up front.
    "mcap",
    "mcap-protobuf-support",
    # Optional: W&B logging in train.py (off by default; --log-wandb to enable).
    "wandb",
    # lerobot: VLA/policy models (ACT, Diffusion, Pi0, SmolVLA, …)
    # Installed as editable from local submodule (third_party/lerobot).
    "lerobot",
]

[tool.uv]
# lerobot 0.5.1 pins torch<2.11.0 and torchcodec<0.11.0, but we use the
# newer versions already validated in the main workspace.  Override here
# so uv resolves without conflict.
override-dependencies = [
    "torch==2.11.0+cu128",
    "torchcodec==0.11.0+cpu",
]

[tool.uv.sources]
lerobot = { path = "third_party/lerobot", editable = true }
torch = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
